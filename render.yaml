services:
  - type: web
    name: proflow-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://pm-ai-agent-five.vercel.app

databases:
  - name: proflow-db
    databaseName: proflow
    user: proflow
    plan: free
